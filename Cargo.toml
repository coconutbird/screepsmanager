[package]
name = "screepsmanager"
description = "Uploads built Screeps code (JavaScript, source maps, WebAssembly) to the branches of Screeps servers through named profiles: the official server, seasonal servers, and private servers; and keeps a spawn of the account in the world."
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
rust-version = "1.99"

# Keep this list short. Each entry needs a reason that std cannot meet.
[dependencies]
# The command line, with defaults from environment variables.
clap = { version = "4", features = ["derive", "env"] }
# The Screeps API: a blocking HTTP/1.1 client with JSON bodies, and TLS by
# rustls on the process-wide provider (ring), which `main` installs, so
# that no C toolchain builds a crypto library.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The typed configuration and API bodies.
serde = { version = "1", features = ["derive"] }
# The bodies of the API.
serde_json = "1"
# The configuration file.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
# The Display, Error, and From impls of the error enums.
thiserror = "2"
# Server URLs and their parse errors (reqwest re-exports `Url` only).
url = "2"
# The binary modules (WebAssembly) of an upload are base64 text.
base64 = "0.23"
# The heartbeat that the bot keeps in Memory, which the API returns as
# gzip; the pure-Rust backend needs no C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# `--env-file`: the dotenv format that other tools write, quotes, escapes,
# and substitutions included.
dotenvy = "0.15"

[lints.rust]
warnings = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
allow_attributes = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lints.rustdoc]
all = { level = "warn", priority = -1 }

# A panic is a bug: abort without unwinding.
[profile.release]
panic = "abort"
